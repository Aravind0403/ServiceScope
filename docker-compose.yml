services:
  payment-gateway:
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "5001:5001"
    networks:
      - service-net

  neo4j:
    image: neo4j:5.15
    ports:
      - "7474:7474"     # UI
      - "7687:7687"     # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/Ar@v!nd0495()
    volumes:
      - neo4j_data:/data
    networks:
      - service-net

networks:
  service-net:

volumes:
  neo4j_data: